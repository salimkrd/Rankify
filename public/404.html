<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rankify</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License: https://github.com/rafgraph/spa-github-pages
      // Check if URL is for a static asset file. If so, DO NOT redirect (preserve 404).
      var path = window.location.pathname;
      var isAsset = /\.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff2?|ttf|map)$/i.test(path);

      if (!isAsset) {
        var isSubpath = path.indexOf("/Rankify") === 0;
        var segmentCount = isSubpath ? 1 : 0;
        var l = window.location;
        l.replace(
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?p=/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
        );
      }
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0D1B2A;
        color: #F8F9FA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px;
      }
      h1 { font-size: 2rem; margin: 0 0 12px; color: #60A5FA; }
      p { color: #94A3B8; margin: 0 0 24px; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 10px 24px;
        background: #2563EB;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404 - Not Found</h1>
      <p>The requested resource could not be found.</p>
      <a href="/Rankify/">Return to Home</a>
    </div>
  </body>
</html>
